[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false

[workspace.dependencies]
sim = { path = "crates/sim" }
scenes = { path = "crates/scenes" }
# The shared platform layer, pinned. For local co-development, see AGENTS.md.
engine = { git = "https://github.com/Ethan23p/contra-ethos-games", rev = "44a1f43507ad9c974a93dbb60c4561de92de5360" }
pollster = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Keep dev builds of dependencies fast at runtime; our own code stays quick to compile.
[profile.dev.package."*"]
opt-level = 2
# The reference sim drives the harness and the feel benchmark, which run thousands of phases;
# it is small, so optimizing it costs little compile time.
[profile.dev.package.sim]
opt-level = 2
[profile.dev.package.scenes]
opt-level = 2
